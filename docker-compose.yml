services:
  frontend:
    build: ./Frontend
    container_name: innerloop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./Backend
    container_name: innerloop-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://innerloop_user:innerloop_password@postgres:5432/innerloop_db
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: ./Backend
    environment:
      DATABASE_URL: postgresql://innerloop_user:innerloop_password@postgres:5432/innerloop_db
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:15
    container_name: innerloop-postgres
    environment:
      POSTGRES_DB: innerloop_db
      POSTGRES_USER: innerloop_user
      POSTGRES_PASSWORD: innerloop_password
    volumes:
      - innerloop_postgres_data:/var/lib/postgresql/data
      - ./Databases/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./Databases/seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerloop_user -d innerloop_db"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  innerloop_postgres_data:
